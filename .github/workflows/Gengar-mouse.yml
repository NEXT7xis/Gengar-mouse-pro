name: Build Gengar Mouse Pro
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Instalar ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Gerar projeto
        run: |
          set -e
          P=GM
          K=$P/app/src/main/java/com/gengar/mousepro
          R=$P/app/src/main/res
          mkdir -p $K $R/drawable-nodpi $R/drawable $R/values $R/xml $R/mipmap-anydpi-v26

          for i in 1 2 3 4; do
            if [ -f wallpapers/wp$i.webp ]; then cp wallpapers/wp$i.webp $R/drawable-nodpi/gengar_wp$i.webp
            else convert -size 720x1280 gradient:'#5B21B6-#12031F' $R/drawable-nodpi/gengar_wp$i.png; fi
          done

          cat > $P/settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "GengarMousePro"
          include(":app")
          EOF

          cat > $P/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          echo "org.gradle.jvmargs=-Xmx2g" > $P/gradle.properties

          cat > $P/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.gengar.mousepro"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.gengar.mousepro"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0"
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@style/Theme.GM"
                  android:allowBackup="false">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".MapperService"
                      android:exported="false"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > $R/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:notificationTimeout="500"
              android:description="@string/service_desc" />
          EOF

          cat > $R/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Gengar Mouse Pro</string>
              <string name="service_desc">Usado somente para converter teclado e mouse em toques na tela. Nenhum dado é coletado e o app não usa internet.</string>
          </resources>
          EOF

          cat > $R/values/colors.xml <<'EOF'
          <resources>
              <color name="gm_bg">#12031F</color>
          </resources>
          EOF

          cat > $R/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.GM" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@color/gm_bg</item>
                  <item name="android:statusBarColor">@color/gm_bg</item>
                  <item name="android:navigationBarColor">@color/gm_bg</item>
              </style>
          </resources>
          EOF

          cat > $R/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/gm_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF

          cat > $R/drawable/ic_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#5B21B6" android:pathData="M30,34 L40,24 L46,36 L62,36 L68,24 L78,34 L78,74 L30,74 Z"/>
              <path android:fillColor="#F43F9A" android:pathData="M36,46 L50,52 L36,56 Z"/>
              <path android:fillColor="#F43F9A" android:pathData="M72,46 L58,52 L72,56 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M34,62 Q54,84 74,62 Q54,70 34,62 Z"/>
          </vector>
          EOF

          cat > $K/Config.kt <<'EOF'
          package com.gengar.mousepro

          import android.content.Context
          import android.view.KeyEvent
          import org.json.JSONArray
          import org.json.JSONObject

          object Config {
              const val TAP = 0
              const val HOLD = 1
              const val TOGGLE = 2
              const val JOY = 3
              const val CAM = 4
              val typeNames = arrayOf("TOQUE", "SEGURAR", "ALTERNAR", "JOYSTICK", "CÂMERA")

              // key: teclado = keyCode; mouse E/D/Meio/Voltar/Frente = 1001..1005; scroll cima/baixo = 1010/1011
              class Btn(
                  var id: String, var type: Int, var label: String, var key: Int,
                  var x: Float, var y: Float, var r: Float,
                  var ks: IntArray = intArrayOf(KeyEvent.KEYCODE_W, KeyEvent.KEYCODE_A, KeyEvent.KEYCODE_S, KeyEvent.KEYCODE_D)
              )

              fun defaults(): MutableList<Btn> = mutableListOf(
                  Btn("joy", JOY, "Mover", 0, 0.16f, 0.70f, 0.09f),
                  Btn("cam", CAM, "Câmera", 0, 0.72f, 0.50f, 0.30f),
                  Btn("fire", HOLD, "Atirar", 1001, 0.88f, 0.62f, 0.06f),
                  Btn("scope", TAP, "Mirar", 1002, 0.80f, 0.42f, 0.045f),
                  Btn("jump", TAP, "Pular", KeyEvent.KEYCODE_SPACE, 0.94f, 0.78f, 0.045f),
                  Btn("crouch", TAP, "Agachar", KeyEvent.KEYCODE_C, 0.90f, 0.90f, 0.045f),
                  Btn("reload", TAP, "Recarregar", KeyEvent.KEYCODE_R, 0.72f, 0.88f, 0.045f),
                  Btn("use", TAP, "Interagir", KeyEvent.KEYCODE_F, 0.62f, 0.62f, 0.045f),
                  Btn("w1", TAP, "Arma 1", KeyEvent.KEYCODE_1, 0.58f, 0.92f, 0.045f),
                  Btn("w2", TAP, "Arma 2", KeyEvent.KEYCODE_2, 0.66f, 0.92f, 0.045f),
                  Btn("nade", TAP, "Granada", KeyEvent.KEYCODE_G, 0.50f, 0.80f, 0.045f),
                  Btn("heal", TAP, "Curar", KeyEvent.KEYCODE_H, 0.50f, 0.65f, 0.045f)
              )

              fun keyName(c: Int): String = when {
                  c == 0 -> "—"
                  c == 1001 -> "Mouse E"
                  c == 1002 -> "Mouse D"
                  c == 1003 -> "Mouse Meio"
                  c == 1004 -> "Mouse Voltar"
                  c == 1005 -> "Mouse Frente"
                  c == 1010 -> "Scroll ↑"
                  c == 1011 -> "Scroll ↓"
                  else -> KeyEvent.keyCodeToString(c).removePrefix("KEYCODE_")
              }

              private fun prefs(c: Context) = c.getSharedPreferences("gmp2", Context.MODE_PRIVATE)

              fun profile(c: Context) = prefs(c).getInt("profile", 0)
              fun setProfile(c: Context, v: Int) = prefs(c).edit().putInt("profile", v).apply()

              fun load(c: Context, p: Int = profile(c)): MutableList<Btn> {
                  val s = prefs(c).getString("p$p", null) ?: return defaults()
                  return try {
                      val a = JSONArray(s)
                      val out = mutableListOf<Btn>()
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          val ka = o.getJSONArray("ks")
                          out.add(Btn(
                              o.getString("id"), o.getInt("t"), o.getString("l"), o.getInt("k"),
                              o.getDouble("x").toFloat(), o.getDouble("y").toFloat(), o.getDouble("r").toFloat(),
                              IntArray(4) { ka.getInt(it) }
                          ))
                      }
                      out
                  } catch (e: Exception) { defaults() }
              }

              fun save(c: Context, list: List<Btn>, p: Int = profile(c)) {
                  val a = JSONArray()
                  for (b in list) {
                      val o = JSONObject()
                      o.put("id", b.id); o.put("t", b.type); o.put("l", b.label); o.put("k", b.key)
                      o.put("x", b.x.toDouble()); o.put("y", b.y.toDouble()); o.put("r", b.r.toDouble())
                      o.put("ks", JSONArray(b.ks.toList()))
                      a.put(o)
                  }
                  prefs(c).edit().putString("p$p", a.toString()).apply()
              }

              fun sensX(c: Context) = prefs(c).getFloat("sx", 1.0f)
              fun setSensX(c: Context, v: Float) = prefs(c).edit().putFloat("sx", v).apply()
              fun sensY(c: Context) = prefs(c).getFloat("sy", 1.0f)
              fun setSensY(c: Context, v: Float) = prefs(c).edit().putFloat("sy", v).apply()
              fun smooth(c: Context) = prefs(c).getFloat("smooth", 0.6f)
              fun setSmooth(c: Context, v: Float) = prefs(c).edit().putFloat("smooth", v).apply()
              fun capKey(c: Context) = prefs(c).getInt("cap", KeyEvent.KEYCODE_ESCAPE)
              fun setCapKey(c: Context, v: Int) = prefs(c).edit().putInt("cap", v).apply()
              fun wp(c: Context) = prefs(c).getInt("wp", 2)
              fun setWp(c: Context, v: Int) = prefs(c).edit().putInt("wp", v).apply()
          }
          EOF

          cat > $K/MapperService.kt <<'EOF'
          package com.gengar.mousepro

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.accessibilityservice.GestureDescription.StrokeDescription
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.os.Handler
          import android.os.Looper
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import kotlin.math.abs
          import kotlin.math.hypot
          import kotlin.math.min

          class MapperService : AccessibilityService() {
              companion object {
                  var instance: MapperService? = null
                  private const val TICK = 32L
              }

              private class Ch { var stroke: StrokeDescription? = null; var x = 0f; var y = 0f }

              private val handler = Handler(Looper.getMainLooper())
              private val chs = HashMap<String, Ch>()
              private val taps = ArrayDeque<Pair<Float, Float>>()
              private val pressed = HashSet<Int>()
              private val toggled = HashSet<String>()
              private var wm: WindowManager? = null
              private var overlay: OverlayView? = null
              private var running = false
              private var camIdle = 0
              private var pendX = 0f
              private var pendY = 0f

              var layout: MutableList<Config.Btn> = mutableListOf()

              val isRunning get() = running
              private val sw get() = resources.displayMetrics.widthPixels.toFloat()
              private val sh get() = resources.displayMetrics.heightPixels.toFloat()

              override fun onServiceConnected() { instance = this }
              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() {}
              override fun onDestroy() { stop(); instance = null; super.onDestroy() }

              fun reloadLayout() { layout = Config.load(this) }

              fun start() {
                  if (overlay != null) return
                  reloadLayout()
                  val v = OverlayView(this, this)
                  overlay = v
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  wm!!.addView(v, params(false))
                  running = true
                  v.setCapture(true)
                  handler.post(tickRunnable)
              }

              fun stop() {
                  running = false
                  handler.removeCallbacks(tickRunnable)
                  overlay?.let { it.setCapture(false); try { wm?.removeView(it) } catch (_: Exception) {} }
                  overlay = null
                  releaseAll()
                  toggled.clear()
                  pendX = 0f; pendY = 0f
                  flushRelease()
              }

              fun setEdit(on: Boolean) {
                  val v = overlay ?: return
                  v.edit = on
                  v.setCapture(!on)
                  wm?.updateViewLayout(v, params(on))
                  v.invalidate()
              }

              private fun params(touchable: Boolean): WindowManager.LayoutParams {
                  var f = WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                  if (!touchable) f = f or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                  return WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY, f, PixelFormat.TRANSLUCENT
                  )
              }

              // ---------- entradas ----------
              fun addDelta(dx: Float, dy: Float) { pendX += dx; pendY += dy }

              fun isMapped(code: Int): Boolean =
                  layout.any { it.key == code || (it.type == Config.JOY && code in it.ks) }

              fun releaseAll() { pressed.clear() }

              fun key(code: Int, down: Boolean) {
                  if (down) {
                      if (!pressed.add(code)) return
                      for (b in layout) {
                          if (b.key != code) continue
                          when (b.type) {
                              Config.TAP -> if (taps.size < 6) taps.addLast((b.x * sw) to (b.y * sh))
                              Config.TOGGLE -> if (!toggled.remove(b.id)) toggled.add(b.id)
                          }
                      }
                  } else {
                      pressed.remove(code)
                  }
              }

              fun pulse(code: Int) {
                  key(code, true)
                  handler.postDelayed({ key(code, false) }, 70)
              }

              // ---------- motor ----------
              private val tickRunnable = Runnable { tick() }

              private fun ch(id: String) = chs.getOrPut(id) { Ch() }

              private fun tick() {
                  if (!running) return
                  val strokes = ArrayList<StrokeDescription>()
                  val seen = HashSet<String>()
                  val m = min(sw, sh)

                  for (b in layout.toList()) {
                      val px = b.x * sw
                      val py = b.y * sh
                      when (b.type) {
                          Config.HOLD, Config.TOGGLE -> {
                              seen.add(b.id)
                              val on = if (b.type == Config.HOLD) b.key in pressed else b.id in toggled
                              val c = ch(b.id)
                              if (on) strokes += hold(c, px, py)
                              else if (c.stroke != null) strokes += release(c)
                          }
                          Config.JOY -> {
                              seen.add(b.id)
                              val dx = (if (b.ks[3] in pressed) 1 else 0) - (if (b.ks[1] in pressed) 1 else 0)
                              val dy = (if (b.ks[2] in pressed) 1 else 0) - (if (b.ks[0] in pressed) 1 else 0)
                              val c = ch(b.id)
                              if (dx != 0 || dy != 0) {
                                  val rr = b.r * m
                                  val n = hypot(dx.toFloat(), dy.toFloat())
                                  strokes += move(c, px, py, px + dx / n * rr, py + dy / n * rr)
                              } else if (c.stroke != null) strokes += release(c)
                          }
                      }
                  }

                  val camB = layout.firstOrNull { it.type == Config.CAM }
                  if (camB == null) {
                      pendX = 0f; pendY = 0f
                  } else {
                      seen.add(camB.id)
                      val cc = ch(camB.id)
                      val cx = camB.x * sw
                      val cy = camB.y * sh
                      val ext = camB.r * m
                      if (abs(pendX) > 0.5f || abs(pendY) > 0.5f) {
                          camIdle = 0
                          val k = Config.smooth(this)
                          val dx = pendX * k
                          val dy = pendY * k
                          pendX -= dx; pendY -= dy
                          val fx = if (cc.stroke == null) cx else cc.x
                          val fy = if (cc.stroke == null) cy else cc.y
                          var tx = fx + dx * Config.sensX(this)
                          var ty = fy + dy * Config.sensY(this)
                          if (cc.stroke == null) {
                              tx = tx.coerceIn(cx - ext, cx + ext)
                              ty = ty.coerceIn(cy - ext, cy + ext)
                          }
                          if (abs(tx - cx) > ext || abs(ty - cy) > ext) {
                              strokes += release(cc)
                              pendX += dx; pendY += dy
                          } else strokes += move(cc, cx, cy, tx, ty)
                      } else if (cc.stroke != null) {
                          camIdle++
                          strokes += if (camIdle > 3) release(cc) else hold(cc, cc.x, cc.y)
                      }
                  }

                  for ((id, c) in chs) if (id !in seen && c.stroke != null) strokes += release(c)

                  val tapStrokes = ArrayList<StrokeDescription>()
                  while (taps.isNotEmpty() && strokes.size + tapStrokes.size < 18) {
                      val t = taps.removeFirst()
                      val p = Path().apply { moveTo(t.first, t.second) }
                      tapStrokes += StrokeDescription(p, 0, TICK)
                  }

                  if (strokes.isEmpty() && tapStrokes.isEmpty()) {
                      handler.postDelayed(tickRunnable, TICK); return
                  }
                  val b = GestureDescription.Builder()
                  strokes.forEach { b.addStroke(it) }
                  tapStrokes.forEach { b.addStroke(it) }
                  val ok = dispatchGesture(b.build(), object : GestureResultCallback() {
                      override fun onCompleted(g: GestureDescription?) { handler.post(tickRunnable) }
                      override fun onCancelled(g: GestureDescription?) { resetAll(); handler.post(tickRunnable) }
                  }, null)
                  if (!ok) { resetAll(); handler.postDelayed(tickRunnable, TICK) }
              }

              private fun move(ch: Ch, sx: Float, sy: Float, tx: Float, ty: Float): StrokeDescription {
                  val p = Path()
                  val prev = ch.stroke
                  val s = if (prev == null) {
                      p.moveTo(sx, sy); p.lineTo(tx, ty)
                      StrokeDescription(p, 0, TICK, true)
                  } else {
                      p.moveTo(ch.x, ch.y); p.lineTo(tx, ty)
                      prev.continueStroke(p, 0, TICK, true)
                  }
                  ch.stroke = s; ch.x = tx; ch.y = ty
                  return s
              }

              private fun hold(ch: Ch, x: Float, y: Float): StrokeDescription {
                  val p = Path()
                  val prev = ch.stroke
                  val s = if (prev == null) {
                      ch.x = x; ch.y = y
                      p.moveTo(x, y); StrokeDescription(p, 0, TICK, true)
                  } else {
                      p.moveTo(ch.x, ch.y); prev.continueStroke(p, 0, TICK, true)
                  }
                  ch.stroke = s
                  return s
              }

              private fun release(ch: Ch): StrokeDescription {
                  val p = Path().apply { moveTo(ch.x, ch.y) }
                  val s = ch.stroke!!.continueStroke(p, 0, 1, false)
                  ch.stroke = null
                  return s
              }

              private fun resetAll() { chs.values.forEach { it.stroke = null } }

              private fun flushRelease() {
                  val list = ArrayList<StrokeDescription>()
                  for (c in chs.values) if (c.stroke != null) list += release(c)
                  if (list.isEmpty()) return
                  val b = GestureDescription.Builder()
                  list.forEach { b.addStroke(it) }
                  dispatchGesture(b.build(), null, null)
              }
          }
          EOF

          cat > $K/OverlayView.kt <<'EOF'
          package com.gengar.mousepro

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RectF
          import android.view.KeyEvent
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.hypot

          class OverlayView(ctx: Context, private val svc: MapperService) : View(ctx) {
              var edit = false
              private var wantCapture = false
              private val d = resources.displayMetrics.density
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rects = LinkedHashMap<String, RectF>()
              private var sel: Config.Btn? = null
              private var drag: Config.Btn? = null
              private var listen = 0      // 0 nada, 1 uma tecla, 2 quatro teclas do joystick
              private var listenIdx = 0
              private var lastButtons = 0
              private val pink = Color.rgb(244, 63, 154)
              private val maskCodes = listOf(
                  MotionEvent.BUTTON_PRIMARY to 1001, MotionEvent.BUTTON_SECONDARY to 1002,
                  MotionEvent.BUTTON_TERTIARY to 1003, MotionEvent.BUTTON_BACK to 1004,
                  MotionEvent.BUTTON_FORWARD to 1005
              )

              init {
                  isFocusable = true; isFocusableInTouchMode = true
                  paint.textAlign = Paint.Align.CENTER
              }

              fun setCapture(on: Boolean) {
                  wantCapture = on
                  if (on) { requestFocus(); requestPointerCapture() } else releasePointerCapture()
                  invalidate()
              }

              override fun onWindowFocusChanged(hasWindowFocus: Boolean) {
                  super.onWindowFocusChanged(hasWindowFocus)
                  if (hasWindowFocus && wantCapture) { requestFocus(); requestPointerCapture() }
                  if (!hasWindowFocus) svc.releaseAll()
              }

              override fun onPointerCaptureChange(hasCapture: Boolean) {
                  if (!hasCapture) {
                      for ((_, c) in maskCodes) svc.key(c, false)
                      lastButtons = 0
                  }
                  invalidate()
              }

              // ---------- teclado ----------
              override fun onKeyDown(code: Int, e: KeyEvent): Boolean {
                  if (edit) {
                      if (listen != 0) { assign(code); return true }
                      return super.onKeyDown(code, e)
                  }
                  if (code == Config.capKey(context)) {
                      if (e.repeatCount == 0) setCapture(!hasPointerCapture())
                      return true
                  }
                  svc.key(code, true)
                  return if (svc.isMapped(code)) true else super.onKeyDown(code, e)
              }

              override fun onKeyUp(code: Int, e: KeyEvent): Boolean {
                  if (edit) return super.onKeyUp(code, e)
                  svc.key(code, false)
                  return if (svc.isMapped(code)) true else super.onKeyUp(code, e)
              }

              // ---------- mouse capturado ----------
              override fun onCapturedPointerEvent(e: MotionEvent): Boolean {
                  val bs = e.buttonState
                  val v = e.getAxisValue(MotionEvent.AXIS_VSCROLL)
                  if (edit && listen != 0) {
                      for ((m, c) in maskCodes) {
                          if ((bs and m) != 0 && (lastButtons and m) == 0) { lastButtons = bs; assign(c); return true }
                      }
                      lastButtons = bs
                      if (e.actionMasked == MotionEvent.ACTION_SCROLL && v != 0f) assign(if (v > 0) 1010 else 1011)
                      return true
                  }
                  for ((m, c) in maskCodes) {
                      val now = (bs and m) != 0
                      val was = (lastButtons and m) != 0
                      if (now != was) svc.key(c, now)
                  }
                  lastButtons = bs
                  when (e.actionMasked) {
                      MotionEvent.ACTION_MOVE -> svc.addDelta(e.x, e.y)
                      MotionEvent.ACTION_SCROLL -> if (v != 0f) svc.pulse(if (v > 0) 1010 else 1011)
                  }
                  return true
              }

              // ---------- edição ----------
              private fun assign(code: Int) {
                  val b = sel ?: return
                  if (listen == 1) {
                      b.key = code; listen = 0
                  } else {
                      b.ks[listenIdx] = code
                      listenIdx++
                      if (listenIdx >= 4) listen = 0
                  }
                  Config.save(context, svc.layout)
                  if (listen == 0) setCapture(false)
                  invalidate()
              }

              private fun drawBtn(c: Canvas, id: String, text: String, r: RectF) {
                  rects[id] = r
                  paint.style = Paint.Style.FILL; paint.color = Color.argb(225, 60, 20, 110)
                  c.drawRoundRect(r, 14 * d, 14 * d, paint)
                  paint.style = Paint.Style.STROKE; paint.strokeWidth = 2 * d; paint.color = Color.rgb(124, 58, 237)
                  c.drawRoundRect(r, 14 * d, 14 * d, paint)
                  paint.style = Paint.Style.FILL; paint.color = Color.WHITE; paint.textSize = 13 * d
                  c.drawText(text, r.centerX(), r.centerY() + 5 * d, paint)
              }

              override fun onDraw(c: Canvas) {
                  if (!edit) {
                      if (hasPointerCapture()) {
                          paint.style = Paint.Style.FILL; paint.color = pink
                          c.drawCircle(14 * d, 14 * d, 4 * d, paint)
                      }
                      return
                  }
                  rects.clear()
                  c.drawColor(Color.argb(150, 10, 0, 25))
                  val m = minOf(width, height).toFloat()

                  for (b in svc.layout) {
                      val x = b.x * width
                      val y = b.y * height
                      val isSel = b === sel
                      paint.style = Paint.Style.FILL; paint.color = Color.argb(150, 124, 58, 237)
                      if (b.type == Config.CAM) {
                          val ext = b.r * m
                          paint.style = Paint.Style.STROKE; paint.strokeWidth = (if (isSel) 4 else 2) * d
                          paint.color = if (isSel) Color.WHITE else pink
                          c.drawRect(x - ext, y - ext, x + ext, y + ext, paint)
                          paint.style = Paint.Style.FILL; paint.color = Color.argb(190, 124, 58, 237)
                          c.drawCircle(x, y, 30 * d, paint)
                      } else {
                          val rad = maxOf(b.r * m, 26 * d)
                          c.drawCircle(x, y, rad, paint)
                          paint.style = Paint.Style.STROKE; paint.strokeWidth = (if (isSel) 4 else 2) * d
                          paint.color = if (isSel) Color.WHITE else pink
                          c.drawCircle(x, y, rad, paint)
                      }
                      paint.style = Paint.Style.FILL; paint.color = Color.WHITE
                      paint.textSize = 11 * d
                      c.drawText(b.label, x, y - 2 * d, paint)
                      paint.textSize = 9 * d; paint.color = Color.rgb(255, 190, 220)
                      val kn = if (b.type == Config.JOY) b.ks.joinToString("") { Config.keyName(it).take(1) }
                               else Config.keyName(b.key)
                      c.drawText(kn, x, y + 11 * d, paint)
                  }

                  val top = 12 * d
                  drawBtn(c, "add", "+ Botão", RectF(12 * d, top, 122 * d, top + 44 * d))
                  drawBtn(c, "prof", "Perfil ${Config.profile(context) + 1}", RectF(130 * d, top, 240 * d, top + 44 * d))
                  drawBtn(c, "ok", "CONCLUIR", RectF(width - 132 * d, top, width - 12 * d, top + 44 * d))

                  val b = sel
                  if (b != null) {
                      val pt = height - 112 * d
                      paint.style = Paint.Style.FILL; paint.color = Color.argb(235, 18, 3, 31)
                      c.drawRoundRect(RectF(12 * d, pt, width - 12 * d, height - 8 * d), 16 * d, 16 * d, paint)
                      paint.color = Color.WHITE; paint.textSize = 13 * d
                      val info = if (listen == 1) "Aperte a tecla ou botão do mouse para ${b.label}"
                      else if (listen == 2) "Aperte a tecla de " + arrayOf("CIMA", "ESQUERDA", "BAIXO", "DIREITA")[listenIdx]
                      else {
                          val ks = if (b.type == Config.JOY) b.ks.joinToString(" ") { Config.keyName(it) } else Config.keyName(b.key)
                          "${b.label} · ${Config.typeNames[b.type]} · $ks"
                      }
                      c.drawText(info, width / 2f, pt + 26 * d, paint)
                      val names = arrayOf("key" to "Tecla", "type" to "Tipo", "minus" to "−", "plus" to "+", "del" to "Apagar")
                      val bw = (width - 24 * d - 16 * d) / 5f
                      for ((i, p) in names.withIndex()) {
                          val l = 12 * d + i * (bw + 4 * d)
                          drawBtn(c, p.first, p.second, RectF(l, pt + 42 * d, l + bw, pt + 94 * d))
                      }
                  }
              }

              private fun near(b: Config.Btn, x: Float, y: Float): Boolean {
                  val m = minOf(width, height).toFloat()
                  val rad = if (b.type == Config.CAM) 36 * d else maxOf(b.r * m, 26 * d) + 8 * d
                  return hypot(b.x * width - x, b.y * height - y) < rad
              }

              private fun act(id: String) {
                  val b = sel
                  when (id) {
                      "add" -> {
                          val n = Config.Btn("b" + System.currentTimeMillis(), Config.TAP, "Novo", 0, 0.5f, 0.5f, 0.045f)
                          svc.layout.add(n); sel = n
                      }
                      "prof" -> {
                          Config.save(context, svc.layout)
                          Config.setProfile(context, (Config.profile(context) + 1) % 3)
                          svc.reloadLayout(); sel = null; listen = 0
                      }
                      "ok" -> { listen = 0; Config.save(context, svc.layout); svc.setEdit(false) }
                      "key" -> if (b != null) {
                          listen = if (b.type == Config.JOY) 2 else 1
                          listenIdx = 0
                          setCapture(true)
                      }
                      "type" -> if (b != null) b.type = (b.type + 1) % 5
                      "minus", "plus" -> if (b != null) {
                          val st = if (b.type == Config.CAM) 0.02f else 0.005f
                          b.r = (b.r + (if (id == "plus") st else -st)).coerceIn(0.02f, 0.45f)
                      }
                      "del" -> if (b != null) { svc.layout.remove(b); sel = null }
                  }
                  if (id != "ok" && id != "prof") Config.save(context, svc.layout)
                  invalidate()
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  if (!edit) return false
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          val hit = rects.entries.firstOrNull { it.value.contains(e.x, e.y) }?.key
                          if (hit != null) { act(hit); return true }
                          val b = svc.layout.lastOrNull { near(it, e.x, e.y) }
                          sel = b; drag = b
                          if (b == null) { listen = 0; setCapture(false) }
                          invalidate()
                      }
                      MotionEvent.ACTION_MOVE -> drag?.let {
                          it.x = (e.x / width).coerceIn(0.02f, 0.98f)
                          it.y = (e.y / height).coerceIn(0.02f, 0.98f)
                          invalidate()
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                          if (drag != null) Config.save(context, svc.layout)
                          drag = null
                      }
                  }
                  return true
              }
          }
          EOF

          cat > $K/MainActivity.kt <<'EOF'
          package com.gengar.mousepro

          import android.app.Activity
          import android.content.Intent
          import android.content.res.ColorStateList
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.ViewGroup.LayoutParams.MATCH_PARENT
          import android.view.ViewGroup.LayoutParams.WRAP_CONTENT
          import android.widget.*

          class MainActivity : Activity() {
              private lateinit var bg: ImageView
              private lateinit var status: TextView
              private lateinit var capBtn: Button
              private var waitKey = false
              private val wps = intArrayOf(R.drawable.gengar_wp1, R.drawable.gengar_wp2, R.drawable.gengar_wp3, R.drawable.gengar_wp4)
              private val pink = Color.rgb(244, 63, 154)
              private val purple = Color.rgb(124, 58, 237)
              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val root = FrameLayout(this)
                  bg = ImageView(this).apply { scaleType = ImageView.ScaleType.CENTER_CROP }
                  root.addView(bg, FrameLayout.LayoutParams(MATCH_PARENT, MATCH_PARENT))
                  root.addView(View(this).apply { setBackgroundColor(Color.argb(150, 0, 0, 0)) },
                      FrameLayout.LayoutParams(MATCH_PARENT, MATCH_PARENT))

                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(22), dp(36), dp(22), dp(24))
                  }
                  col.addView(TextView(this).apply {
                      text = "GENGAR MOUSE PRO"; textSize = 26f; setTextColor(pink)
                      typeface = Typeface.DEFAULT_BOLD; gravity = Gravity.CENTER
                  })
                  status = TextView(this).apply {
                      textSize = 14f; setTextColor(Color.WHITE); gravity = Gravity.CENTER
                      setPadding(0, dp(8), 0, dp(16))
                  }
                  col.addView(status)

                  col.addView(btn("Ativar serviço de acessibilidade") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  })
                  col.addView(btn("▶  Iniciar mapeador") {
                      val s = MapperService.instance
                      if (s == null) toast("Ative o serviço em Acessibilidade primeiro") else {
                          s.start(); refresh(); moveTaskToBack(true)
                          toast("Abra o jogo. A tecla do cursor solta/pega o mouse")
                      }
                  })
                  col.addView(btn("✎  Editar layout dos botões") {
                      val s = MapperService.instance
                      if (s == null) toast("Ative o serviço em Acessibilidade primeiro") else {
                          s.start(); s.setEdit(true); moveTaskToBack(true)
                          toast("Abra o jogo e arraste os botões. Toque num botão para configurar")
                      }
                  })
                  col.addView(btn("■  Parar") { MapperService.instance?.stop(); refresh() })

                  capBtn = btn("Tecla do cursor: ${Config.keyName(Config.capKey(this))}") {
                      waitKey = true; capBtn.text = "Aperte uma tecla do teclado..."
                  }
                  col.addView(capBtn)

                  col.addView(label("Sensibilidade horizontal (X)"))
                  col.addView(seek(27, ((Config.sensX(this) * 10) - 3).toInt()) { Config.setSensX(this, (it + 3) / 10f) })
                  col.addView(label("Sensibilidade vertical (Y)"))
                  col.addView(seek(27, ((Config.sensY(this) * 10) - 3).toInt()) { Config.setSensY(this, (it + 3) / 10f) })
                  col.addView(label("Suavização da mira (maior = mais direto, menor = mais estável)"))
                  col.addView(seek(7, ((Config.smooth(this) * 10) - 3).toInt()) { Config.setSmooth(this, (it + 3) / 10f) })

                  col.addView(label("Perfil de layout"))
                  val prow = LinearLayout(this)
                  for (i in 0..2) {
                      val lp = LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f).apply { setMargins(dp(4), 0, dp(4), 0) }
                      prow.addView(btn("Perfil ${i + 1}", lp) {
                          Config.setProfile(this, i); MapperService.instance?.reloadLayout(); refresh()
                      })
                  }
                  col.addView(prow)
                  col.addView(btn("Restaurar layout padrão deste perfil") {
                      Config.save(this, Config.defaults()); MapperService.instance?.reloadLayout()
                      toast("Layout padrão restaurado")
                  })

                  col.addView(label("Wallpaper"))
                  val row = LinearLayout(this)
                  for (i in wps.indices) {
                      val lp = LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f).apply { setMargins(dp(4), 0, dp(4), 0) }
                      row.addView(btn("${i + 1}", lp) { Config.setWp(this, i); bg.setImageResource(wps[i]) })
                  }
                  col.addView(row)

                  col.addView(TextView(this).apply {
                      text = "Em \"Editar layout\": arraste os botões, toque num botão para mudar tecla, tipo e tamanho, " +
                              "use + Botão para criar outro e Perfil para trocar de layout. " +
                              "Joystick usa 4 teclas à sua escolha; Câmera é a área onde o mouse gira a visão."
                      textSize = 12f; setTextColor(Color.LTGRAY); setPadding(0, dp(16), 0, 0)
                  })

                  root.addView(ScrollView(this).apply { addView(col) })
                  setContentView(root)
                  bg.setImageResource(wps[Config.wp(this).coerceIn(0, 3)])
              }

              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
                  if (waitKey) {
                      waitKey = false
                      Config.setCapKey(this, keyCode)
                      capBtn.text = "Tecla do cursor: ${Config.keyName(keyCode)}"
                      return true
                  }
                  return super.onKeyDown(keyCode, event)
              }

              override fun onResume() { super.onResume(); refresh() }

              private fun refresh() {
                  val s = MapperService.instance
                  val p = "Perfil ${Config.profile(this) + 1}"
                  status.text = when {
                      s == null -> "⚠ Serviço desativado — ative em Acessibilidade"
                      s.isRunning -> "● Mapeador ATIVO · $p"
                      else -> "Pronto · $p"
                  }
              }

              private fun toast(t: String) = Toast.makeText(this, t, Toast.LENGTH_LONG).show()
              private fun label(t: String) = TextView(this).apply {
                  text = t; textSize = 13f; setTextColor(Color.WHITE); setPadding(0, dp(14), 0, dp(4))
              }
              private fun seek(mx: Int, pr: Int, f: (Int) -> Unit) = SeekBar(this).apply {
                  max = mx; progress = pr
                  progressTintList = ColorStateList.valueOf(pink)
                  thumbTintList = ColorStateList.valueOf(pink)
                  setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar, p: Int, u: Boolean) { if (u) f(p) }
                      override fun onStartTrackingTouch(s: SeekBar) {}
                      override fun onStopTrackingTouch(s: SeekBar) {}
                  })
              }
              private fun btn(t: String, lp: LinearLayout.LayoutParams? = null, onClick: () -> Unit) = Button(this).apply {
                  text = t; setTextColor(Color.WHITE); isAllCaps = false
                  background = GradientDrawable().apply {
                      setColor(Color.argb(210, 60, 20, 110)); cornerRadius = dp(14).toFloat(); setStroke(dp(2), purple)
                  }
                  layoutParams = lp ?: LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply { setMargins(0, dp(6), 0, dp(6)) }
                  setOnClickListener { onClick() }
              }
          }
          EOF

      - name: Compilar APK
        working-directory: GM
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GengarMousePro-apk
          path: GM/app/build/outputs/apk/debug/*.apk
