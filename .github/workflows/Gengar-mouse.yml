          import rikka.shizuku.Shizuku

          class MainActivity : Activity() {
              private lateinit var bg: ImageView
              private lateinit var status: TextView
              private lateinit var capBtn: Button
              private var waitKey = false
              private val wps = intArrayOf(R.drawable.gengar_wp1, R.drawable.gengar_wp2, R.drawable.gengar_wp3, R.drawable.gengar_wp4)
              private val pink = Color.rgb(244, 63, 154)
              private val purple = Color.rgb(124, 58, 237)
              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private val permListener = Shizuku.OnRequestPermissionResultListener { _, res ->
                  if (res == PackageManager.PERMISSION_GRANTED) runOnUiThread { shizuku() }
              }

              private val conn = object : ServiceConnection {
                  override fun onServiceConnected(n: ComponentName?, b: IBinder?) {
                      if (b == null) return
                      val d = Parcel.obtain()
                      val r = Parcel.obtain()
                      try {
                          d.writeString(Config.token(this@MainActivity))
                          b.transact(1, d, r, 0)
                      } catch (e: Exception) {
                          toast("Falha: " + e.message)
                      } finally {
                          d.recycle(); r.recycle()
                      }
                      Client.connect(this@MainActivity) { ok ->
                          refresh()
                          toast(if (ok) "Servidor conectado" else "Servidor não respondeu")
                      }
                  }
                  override fun onServiceDisconnected(n: ComponentName?) {}
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  Shizuku.addRequestPermissionResultListener(permListener)
                  val root = FrameLayout(this)
                  bg = ImageView(this).apply { scaleType = ImageView.ScaleType.CENTER_CROP }
                  root.addView(bg, FrameLayout.LayoutParams(MATCH_PARENT, MATCH_PARENT))
                  root.addView(View(this).apply { setBackgroundColor(Color.argb(150, 0, 0, 0)) },
                      FrameLayout.LayoutParams(MATCH_PARENT, MATCH_PARENT))

                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(22), dp(36), dp(22), dp(24))
                  }
                  col.addView(TextView(this).apply {
                      text = "GENGAR MOUSE PRO"; textSize = 26f; setTextColor(pink)
                      typeface = Typeface.DEFAULT_BOLD; gravity = Gravity.CENTER
                  })
                  status = TextView(this).apply {
                      textSize = 14f; setTextColor(Color.WHITE); gravity = Gravity.CENTER
                      setPadding(0, dp(8), 0, dp(16))
                  }
                  col.addView(status)

                  col.addView(label("1) Permissão"))
                  col.addView(btn("Permitir sobreposição de tela") {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  })
                  col.addView(label("2) Conexão (escolha uma)"))
                  col.addView(btn("Conectar via Shizuku") { shizuku() })
                  col.addView(btn("Depuração USB/ADB: copiar comando") {
                      val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      cm.setPrimaryClip(ClipData.newPlainText("adb", adbCmd()))
                      toast("Comando copiado. Cole no terminal (adb) e depois toque em Verificar conexão")
                  })
                  col.addView(btn("Verificar conexão") {
                      Client.connect(this) { ok -> refresh(); toast(if (ok) "Servidor conectado" else "Servidor não encontrado") }
                  })

                  col.addView(label("3) Mapeador"))
                  col.addView(btn("▶  Iniciar mapeador") {
                      when {
                          !Settings.canDrawOverlays(this) -> toast("Permita a sobreposição de tela primeiro")
                          !Client.connected -> toast("Conecte via Shizuku ou ADB primeiro")
                          else -> {
                              startForegroundService(Intent(this, MapperService::class.java).putExtra("mode", "run"))
                              moveTaskToBack(true)
                              toast("Abra o jogo. A tecla do cursor solta/pega o mouse")
                          }
                      }
                  })
                  col.addView(btn("✎  Editar layout dos botões") {
                      when {
                          !Settings.canDrawOverlays(this) -> toast("Permita a sobreposição de tela primeiro")
                          !Client.connected -> toast("Conecte via Shizuku ou ADB primeiro")
                          else -> {
                              startForegroundService(Intent(this, MapperService::class.java).putExtra("mode", "edit"))
                              moveTaskToBack(true)
                              toast("Abra o jogo e arraste os botões. Toque num botão para configurar")
                          }
                      }
                  })
                  col.addView(btn("■  Parar") { MapperService.instance?.shutdown(); refresh() })
                  col.addView(btn("Encerrar servidor shell") { Client.quit(); refresh() })

                  capBtn = btn("Tecla do cursor: ${Config.keyName(Config.capKey(this))}") {
                      waitKey = true; capBtn.text = "Aperte uma tecla do teclado..."
                  }
                  col.addView(capBtn)

                  col.addView(label("Sensibilidade horizontal (X)"))
                  col.addView(seek(37, ((Config.sensX(this) * 10) - 3).toInt()) { Config.setSensX(this, (it + 3) / 10f) })
                  col.addView(label("Sensibilidade vertical (Y)"))
                  col.addView(seek(37, ((Config.sensY(this) * 10) - 3).toInt()) { Config.setSensY(this, (it + 3) / 10f) })
                  col.addView(label("Sensibilidade ao atirar (multiplicador)"))
                  col.addView(seek(13, ((Config.fireMul(this) * 10) - 2).toInt()) { Config.setFireMul(this, (it + 2) / 10f) })

                  col.addView(label("Perfil de layout"))
                  val prow = LinearLayout(this)
                  for (i in 0..2) {
                      val lp = LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f).apply { setMargins(dp(4), 0, dp(4), 0) }
                      prow.addView(btn("Perfil ${i + 1}", lp) {
                          Config.setProfile(this, i); MapperService.instance?.reloadLayout(); refresh()
                      })
                  }
                  col.addView(prow)
                  col.addView(btn("Exportar layout (copiar)") {
                      val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      cm.setPrimaryClip(ClipData.newPlainText("layout", Config.toJson(Config.load(this))))
                      toast("Layout copiado")
                  })
                  col.addView(btn("Importar layout (colar)") {
                      val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      val clip = cm.primaryClip
                      val txt = if (clip != null && clip.itemCount > 0) clip.getItemAt(0).text?.toString() else null
                      val l = if (txt != null) Config.fromJson(txt) else null
                      if (l == null) toast("A área de transferência não tem um layout válido") else {
                          Config.save(this, l); MapperService.instance?.reloadLayout(); toast("Layout importado")
                      }
                  })
                  col.addView(btn("Restaurar layout padrão deste perfil") {
                      Config.save(this, Config.defaults()); MapperService.instance?.reloadLayout()
                      toast("Layout padrão restaurado")
                  })

                  col.addView(label("Wallpaper"))
                  val row = LinearLayout(this)
                  for (i in wps.indices) {
                      val lp = LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f).apply { setMargins(dp(4), 0, dp(4), 0) }
                      row.addView(btn("${i + 1}", lp) { Config.setWp(this, i); bg.setImageResource(wps[i]) })
                  }
                  col.addView(row)

                  col.addView(TextView(this).apply {
                      text = "Em \"Editar layout\": arraste os botões, toque num botão para mudar tecla, tipo e tamanho, " +
                              "use + Botão para criar outro e Perfil para trocar de layout. " +
                              "Joystick usa 4 teclas à sua escolha; Câmera é a área onde o mouse gira a visão."
                      textSize = 12f; setTextColor(Color.LTGRAY); setPadding(0, dp(16), 0, 0)
                  })

                  root.addView(ScrollView(this).apply { addView(col) })
                  setContentView(root)
                  bg.setImageResource(wps[Config.wp(this).coerceIn(0, 3)])
              }

              override fun onDestroy() {
                  Shizuku.removeRequestPermissionResultListener(permListener)
                  super.onDestroy()
              }

              private fun adbCmd(): String =
                  "adb shell appops set $packageName SYSTEM_ALERT_WINDOW allow\n" +
                  "adb shell 'CLASSPATH=\$(pm path $packageName | cut -d: -f2) nohup setsid app_process /system/bin " +
                  "--nice-name=gmp_server com.gengar.mousepro.Server ${Config.token(this)} >/dev/null 2>&1 &'"

              private fun shizuku() {
                  try {
                      if (!Shizuku.pingBinder()) { toast("Shizuku não está ativo. Abra o app Shizuku e inicie o serviço"); return }
                      if (Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) {
                          Shizuku.requestPermission(77); return
                      }
                      @Suppress("DEPRECATION")
                      val ver = packageManager.getPackageInfo(packageName, 0).versionCode
                      val args = Shizuku.UserServiceArgs(ComponentName(packageName, ShellServer::class.java.name))
                          .processNameSuffix("server").debuggable(false).version(ver)
                      Shizuku.bindUserService(args, conn)
                  } catch (e: Throwable) {
                      toast("Shizuku: " + e.message)
                  }
              }

              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
                  if (waitKey) {
                      waitKey = false
                      Config.setCapKey(this, keyCode)
                      capBtn.text = "Tecla do cursor: ${Config.keyName(keyCode)}"
                      return true
                  }
                  return super.onKeyDown(keyCode, event)
              }

              override fun onResume() {
                  super.onResume()
                  refresh()
                  if (!Client.connected) Client.connect(this) { refresh() }
              }

              private fun refresh() {
                  val ov = if (Settings.canDrawOverlays(this)) "✔" else "✘"
                  val sv = if (Client.connected) "● conectado" else "○ desconectado"
                  val mp = if (MapperService.instance?.isRunning == true) "ATIVO" else "parado"
                  status.text = "Sobreposição: $ov\nServidor: $sv\nMapeador: $mp · Perfil ${Config.profile(this) + 1}"
              }

              private fun toast(t: String) = Toast.makeText(this, t, Toast.LENGTH_LONG).show()
              private fun label(t: String) = TextView(this).apply {
                  text = t; textSize = 13f; setTextColor(Color.WHITE); setPadding(0, dp(14), 0, dp(4))
              }
              private fun seek(mx: Int, pr: Int, f: (Int) -> Unit) = SeekBar(this).apply {
                  max = mx; progress = pr
                  progressTintList = ColorStateList.valueOf(pink)
                  thumbTintList = ColorStateList.valueOf(pink)
                  setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar, p: Int, u: Boolean) { if (u) f(p) }
                      override fun onStartTrackingTouch(s: SeekBar) {}
                      override fun onStopTrackingTouch(s: SeekBar) {}
                  })
              }
              private fun btn(t: String, lp: LinearLayout.LayoutParams? = null, onClick: () -> Unit) = Button(this).apply {
                  text = t; setTextColor(Color.WHITE); isAllCaps = false
                  background = GradientDrawable().apply {
                      setColor(Color.argb(210, 60, 20, 110)); cornerRadius = dp(14).toFloat(); setStroke(dp(2), purple)
                  }
                  layoutParams = lp ?: LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply { setMargins(0, dp(6), 0, dp(6)) }
                  setOnClickListener { onClick() }
              }
          }
          EOF

      - name: Compilar APK
        working-directory: GM
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GengarMousePro-apk
          path: GM/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
