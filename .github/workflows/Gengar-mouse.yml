name: Build Gengar Mouse Shizuku
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Instalar ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Gerar projeto
        run: |
          set -e
          P=GM
          K=$P/app/src/main/java/com/gengar/mousepro
          R=$P/app/src/main/res
          mkdir -p $K $R/drawable-nodpi $R/drawable $R/values $R/mipmap-anydpi-v26

          for i in 1 2 3 4; do
            f=$(ls wallpapers/wp$i.* 2>/dev/null | head -n 1 || true)
            if [ -n "$f" ]; then cp "$f" "$R/drawable-nodpi/gengar_wp$i.${f##*.}"
            else convert -size 720x1280 gradient:'#5B21B6-#12031F' $R/drawable-nodpi/gengar_wp$i.png; fi
          done

          cat > $P/settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "GengarMousePro"
          include(":app")
          EOF

          cat > $P/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > $P/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > $P/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.gengar.mousepro"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.gengar.mousepro"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 3
                  versionName = "3.0"
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF

          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@style/Theme.GM"
                  android:allowBackup="false">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".MapperService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="input_mapper" />
                  </service>
                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:multiprocess="false"
                      android:enabled="true"
                      android:exported="true"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
              </application>
          </manifest>
          EOF

          cat > $R/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Gengar Mouse Pro</string>
          </resources>
          EOF

          cat > $R/values/colors.xml <<'EOF'
          <resources>
              <color name="gm_bg">#12031F</color>
          </resources>
          EOF

          cat > $R/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.GM" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@color/gm_bg</item>
                  <item name="android:statusBarColor">@color/gm_bg</item>
                  <item name="android:navigationBarColor">@color/gm_bg</item>
              </style>
          </resources>
          EOF

          cat > $R/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/gm_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF

          cat > $R/drawable/ic_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#5B21B6" android:pathData="M30,34 L40,24 L46,36 L62,36 L68,24 L78,34 L78,74 L30,74 Z"/>
              <path android:fillColor="#F43F9A" android:pathData="M36,46 L50,52 L36,56 Z"/>
              <path android:fillColor="#F43F9A" android:pathData="M72,46 L58,52 L72,56 Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M34,62 Q54,84 74,62 Q54,70 34,62 Z"/>
          </vector>
          EOF

          cat > $K/Config.kt <<'EOF'
          package com.gengar.mousepro

          import android.content.Context
          import android.view.KeyEvent
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.UUID

          object Config {
              const val TAP = 0
              const val HOLD = 1
              const val TOGGLE = 2
              const val JOY = 3
              const val CAM = 4
              val typeNames = arrayOf("TOQUE", "SEGURAR", "ALTERNAR", "JOYSTICK", "CÂMERA")

              // key: teclado = keyCode; mouse E/D/Meio/Voltar/Frente = 1001..1005; scroll cima/baixo = 1010/1011
              class Btn(
                  var id: String, var type: Int, var label: String, var key: Int,
                  var x: Float, var y: Float, var r: Float,
                  var ks: IntArray = intArrayOf(KeyEvent.KEYCODE_W, KeyEvent.KEYCODE_A, KeyEvent.KEYCODE_S, KeyEvent.KEYCODE_D)
              )

              fun defaults(): MutableList<Btn> = mutableListOf(
                  Btn("joy", JOY, "Mover", 0, 0.16f, 0.70f, 0.09f),
                  Btn("cam", CAM, "Câmera", 0, 0.72f, 0.50f, 0.30f),
                  Btn("fire", HOLD, "Atirar", 1001, 0.88f, 0.62f, 0.06f),
                  Btn("scope", TAP, "Mirar", 1002, 0.80f, 0.42f, 0.045f),
                  Btn("jump", TAP, "Pular", KeyEvent.KEYCODE_SPACE, 0.94f, 0.78f, 0.045f),
                  Btn("crouch", TAP, "Agachar", KeyEvent.KEYCODE_C, 0.90f, 0.90f, 0.045f),
                  Btn("reload", TAP, "Recarregar", KeyEvent.KEYCODE_R, 0.72f, 0.88f, 0.045f),
                  Btn("use", TAP, "Interagir", KeyEvent.KEYCODE_F, 0.62f, 0.62f, 0.045f),
                  Btn("w1", TAP, "Arma 1", KeyEvent.KEYCODE_1, 0.58f, 0.92f, 0.045f),
                  Btn("w2", TAP, "Arma 2", KeyEvent.KEYCODE_2, 0.66f, 0.92f, 0.045f),
                  Btn("nade", TAP, "Granada", KeyEvent.KEYCODE_G, 0.50f, 0.80f, 0.045f),
                  Btn("heal", TAP, "Curar", KeyEvent.KEYCODE_H, 0.50f, 0.65f, 0.045f)
              )

              fun keyName(c: Int): String = when {
                  c == 0 -> "—"
                  c == 1001 -> "Mouse E"
                  c == 1002 -> "Mouse D"
                  c == 1003 -> "Mouse Meio"
                  c == 1004 -> "Mouse Voltar"
                  c == 1005 -> "Mouse Frente"
                  c == 1010 -> "Scroll ↑"
                  c == 1011 -> "Scroll ↓"
                  else -> KeyEvent.keyCodeToString(c).removePrefix("KEYCODE_")
              }

              private fun prefs(c: Context) = c.getSharedPreferences("gmp3", Context.MODE_PRIVATE)

              fun token(c: Context): String {
                  val p = prefs(c)
                  val t = p.getString("token", null)
                  if (t != null) return t
                  val n = UUID.randomUUID().toString().replace("-", "")
                  p.edit().putString("token", n).apply()
                  return n
              }

              fun profile(c: Context) = prefs(c).getInt("profile", 0)
              fun setProfile(c: Context, v: Int) = prefs(c).edit().putInt("profile", v).apply()

              fun toJson(list: List<Btn>): String {
                  val a = JSONArray()
                  for (b in list) {
                      val o = JSONObject()
                      o.put("id", b.id); o.put("t", b.type); o.put("l", b.label); o.put("k", b.key)
                      o.put("x", b.x.toDouble()); o.put("y", b.y.toDouble()); o.put("r", b.r.toDouble())
                      o.put("ks", JSONArray(b.ks.toList()))
                      a.put(o)
                  }
                  return a.toString()
              }

              fun fromJson(s: String): MutableList<Btn>? {
                  return try {
                      val a = JSONArray(s)
                      val out = mutableListOf<Btn>()
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          val ka = o.getJSONArray("ks")
                          out.add(Btn(
                              o.getString("id"), o.getInt("t"), o.getString("l"), o.getInt("k"),
                              o.getDouble("x").toFloat(), o.getDouble("y").toFloat(), o.getDouble("r").toFloat(),
                              IntArray(4) { ka.getInt(it) }
                          ))
                      }
                      if (out.isEmpty()) null else out
                  } catch (e: Exception) { null }
              }

              fun load(c: Context, p: Int = profile(c)): MutableList<Btn> {
                  val s = prefs(c).getString("p$p", null) ?: return defaults()
                  return fromJson(s) ?: defaults()
              }

              fun save(c: Context, list: List<Btn>, p: Int = profile(c)) {
                  prefs(c).edit().putString("p$p", toJson(list)).apply()
              }

              fun sensX(c: Context) = prefs(c).getFloat("sx", 1.5f)
              fun setSensX(c: Context, v: Float) = prefs(c).edit().putFloat("sx", v).apply()
              fun sensY(c: Context) = prefs(c).getFloat("sy", 1.5f)
              fun setSensY(c: Context, v: Float) = prefs(c).edit().putFloat("sy", v).apply()
              fun fireMul(c: Context) = prefs(c).getFloat("fm", 1.0f)
              fun setFireMul(c: Context, v: Float) = prefs(c).edit().putFloat("fm", v).apply()
              fun capKey(c: Context) = prefs(c).getInt("cap", KeyEvent.KEYCODE_ESCAPE)
              fun setCapKey(c: Context, v: Int) = prefs(c).edit().putInt("cap", v).apply()
              fun wp(c: Context) = prefs(c).getInt("wp", 2)
              fun setWp(c: Context, v: Int) = prefs(c).edit().putInt("wp", v).apply()
          }
          EOF

          cat > $K/Client.kt <<'EOF'
          package com.gengar.mousepro

          import android.content.Context
          import android.os.Handler
          import android.os.Looper
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.io.OutputStream
          import java.net.InetSocketAddress
          import java.net.Socket
          import java.util.concurrent.Executors

          // Fala com o servidor shell (Shizuku ou ADB) por socket local 127.0.0.1
          object Client {
              const val PORT = 38921
              @Volatile var connected = false
              private val io = Executors.newSingleThreadExecutor()
              private val main = Handler(Looper.getMainLooper())
              private var sock: Socket? = null
              private var out: OutputStream? = null

              fun connect(c: Context, done: ((Boolean) -> Unit)? = null) {
                  val token = Config.token(c)
                  io.execute {
                      var ok = false
                      try {
                          closeNow()
                          val s = Socket()
                          s.tcpNoDelay = true
                          s.connect(InetSocketAddress("127.0.0.1", PORT), 600)
                          s.soTimeout = 1500
                          val o = s.getOutputStream()
                          o.write(("HELLO " + token + "\n").toByteArray()); o.flush()
                          val ans = BufferedReader(InputStreamReader(s.getInputStream())).readLine()
                          if (ans == "OK") { s.soTimeout = 0; sock = s; out = o; ok = true } else s.close()
                      } catch (e: Exception) { }
                      connected = ok
                      if (done != null) main.post { done(ok) }
                  }
              }

              fun send(line: String) {
                  if (!connected) return
                  io.execute {
                      try {
                          val o = out
                          if (o != null) { o.write((line + "\n").toByteArray()); o.flush() }
                      } catch (e: Exception) { connected = false }
                  }
              }

              fun quit() {
                  send("QUIT")
                  io.execute { closeNow() }
              }

              private fun closeNow() {
                  try { sock?.close() } catch (e: Exception) { }
                  sock = null; out = null; connected = false
              }
          }
          EOF

          cat > $K/ShellServer.kt <<'EOF'
          package com.gengar.mousepro

          import android.os.Binder
          import android.os.Parcel
          import android.os.SystemClock
          import android.view.InputDevice
          import android.view.InputEvent
          import android.view.MotionEvent
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.lang.reflect.Method
          import java.net.InetAddress
          import java.net.InetSocketAddress
          import java.net.ServerSocket
          import java.net.Socket
          import kotlin.system.exitProcess

          // Roda como shell (uid 2000): via Shizuku (UserService) ou via adb + app_process.
          class ShellServer : Binder() {
              override fun onTransact(code: Int, data: Parcel, reply: Parcel?, flags: Int): Boolean {
                  if (code == 1) {
                      Server.start(data.readString() ?: "")
                      reply?.writeNoException()
                      return true
                  }
                  return super.onTransact(code, data, reply, flags)
              }
          }

          object Server {
              private var ss: ServerSocket? = null

              @JvmStatic
              fun main(args: Array<String>) {
                  val token = if (args.isNotEmpty()) args[0] else ""
                  if (token.isEmpty() || !start(token)) exitProcess(1)
                  while (true) Thread.sleep(60000)
              }

              @Synchronized
              fun start(token: String): Boolean {
                  if (ss != null) return true
                  if (token.isEmpty()) return false
                  val sock = try {
                      ServerSocket().apply {
                          reuseAddress = true
                          bind(InetSocketAddress(InetAddress.getByName("127.0.0.1"), Client.PORT))
                      }
                  } catch (e: Exception) { return false }
                  ss = sock
                  Thread {
                      val inj = try { Injector() } catch (e: Throwable) { null }
                      while (true) {
                          try {
                              val s = sock.accept()
                              handle(s, token, inj)
                          } catch (e: Exception) { }
                      }
                  }.start()
                  return true
              }

              private fun handle(s: Socket, token: String, inj: Injector?) {
                  try {
                      s.tcpNoDelay = true
                      val r = BufferedReader(InputStreamReader(s.getInputStream()))
                      val o = s.getOutputStream()
                      val hello = r.readLine() ?: return
                      if (hello != "HELLO " + token || inj == null) {
                          o.write("NO\n".toByteArray()); o.flush(); return
                      }
                      o.write("OK\n".toByteArray()); o.flush()
                      while (true) {
                          val line = r.readLine() ?: break
                          val p = line.split(' ')
                          try {
                              when (p[0]) {
                                  "D" -> inj.down(p[1].toInt(), p[2].toFloat(), p[3].toFloat())
                                  "M" -> inj.move(p[1].toInt(), p[2].toFloat(), p[3].toFloat())
                                  "U" -> inj.up(p[1].toInt())
                                  "QUIT" -> { inj.releaseAll(); exitProcess(0) }
                              }
                          } catch (e: NumberFormatException) { } catch (e: IndexOutOfBoundsException) { }
                      }
                  } catch (e: Exception) {
                  } finally {
                      inj?.releaseAll()
                      try { s.close() } catch (e: Exception) { }
                  }
              }
          }

          // Injeta toques multi-dedo reais (MotionEvent) pelo InputManager
          class Injector {
              private val target: Any
              private val method: Method
              private val argc: Int
              private val setDisplay: Method? = try {
                  InputEvent::class.java.getMethod("setDisplayId", Integer.TYPE)
              } catch (e: Throwable) { null }
              private val ids = ArrayList<Int>()
              private val px = HashMap<Int, Float>()
              private val py = HashMap<Int, Float>()
              private var downTime = 0L

              init {
                  var t: Any? = null
                  try {
                      t = Class.forName("android.hardware.input.InputManagerGlobal").getMethod("getInstance").invoke(null)
                  } catch (e: Throwable) { }
                  if (t == null) {
                      t = Class.forName("android.hardware.input.InputManager").getMethod("getInstance").invoke(null)
                  }
                  target = t!!
                  method = target.javaClass.methods.first {
                      it.name == "injectInputEvent" && (it.parameterTypes.size == 2 || it.parameterTypes.size == 3)
                  }
                  argc = method.parameterTypes.size
              }

              private fun inject(ev: MotionEvent) {
                  try { setDisplay?.invoke(ev, 0) } catch (e: Throwable) { }
                  try {
                      if (argc == 3) method.invoke(target, ev, 0, -1) else method.invoke(target, ev, 0)
                  } catch (e: Throwable) { }
              }

              private fun send(action: Int, now: Long) {
                  val n = ids.size
                  val props = Array(n) { i ->
                      MotionEvent.PointerProperties().also { p -> p.id = ids[i]; p.toolType = MotionEvent.TOOL_TYPE_FINGER }
                  }
                  val cs = Array(n) { i ->
                      MotionEvent.PointerCoords().also { c ->
                          c.x = px[ids[i]] ?: 0f; c.y = py[ids[i]] ?: 0f; c.pressure = 1f; c.size = 1f
                      }
                  }
                  val ev = MotionEvent.obtain(downTime, now, action, n, props, cs, 0, 0, 1f, 1f, 0, 0,
                      InputDevice.SOURCE_TOUCHSCREEN, 0)
                  inject(ev)
                  ev.recycle()
              }

              @Synchronized fun down(id: Int, x: Float, y: Float) {
                  if (ids.contains(id)) { move(id, x, y); return }
                  px[id] = x; py[id] = y
                  val now = SystemClock.uptimeMillis()
                  if (ids.isEmpty()) {
                      downTime = now; ids.add(id); send(MotionEvent.ACTION_DOWN, now)
                  } else {
                      ids.add(id); send(MotionEvent.ACTION_POINTER_DOWN or ((ids.size - 1) shl 8), now)
                  }
              }

              @Synchronized fun move(id: Int, x: Float, y: Float) {
                  if (!ids.contains(id)) return
                  px[id] = x; py[id] = y
                  send(MotionEvent.ACTION_MOVE, SystemClock.uptimeMillis())
              }

              @Synchronized fun up(id: Int) {
                  val i = ids.indexOf(id)
                  if (i < 0) return
                  val now = SystemClock.uptimeMillis()
                  if (ids.size == 1) send(MotionEvent.ACTION_UP, now)
                  else send(MotionEvent.ACTION_POINTER_UP or (i shl 8), now)
                  ids.removeAt(i); px.remove(id); py.remove(id)
              }

              @Synchronized fun releaseAll() {
                  while (ids.isNotEmpty()) up(ids[ids.size - 1])
              }
          }
          EOF

          cat > $K/MapperService.kt <<'EOF'
          package com.gengar.mousepro

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.provider.Settings
          import android.view.WindowManager
          import kotlin.math.abs
          import kotlin.math.hypot
          import kotlin.math.min

          class MapperService : Service() {
              companion object {
                  var instance: MapperService? = null
              }

              private val handler = Handler(Looper.getMainLooper())
              private val pressed = HashSet<Int>()
              private val toggled = HashSet<String>()
              private val chIds = HashMap<String, Int>()
              private var wm: WindowManager? = null
              private var overlay: OverlayView? = null
              private var pendX = 0f
              private var pendY = 0f
              private var camOn = false
              private var camX = 0f
              private var camY = 0f
              private var flushPosted = false

              var layout: MutableList<Config.Btn> = mutableListOf()

              val isRunning get() = overlay != null
              private val sw: Float get() {
                  val w = overlay?.width ?: 0
                  return if (w > 0) w.toFloat() else resources.displayMetrics.widthPixels.toFloat()
              }
              private val sh: Float get() {
                  val h = overlay?.height ?: 0
                  return if (h > 0) h.toFloat() else resources.displayMetrics.heightPixels.toFloat()
              }

              override fun onBind(i: Intent?): IBinder? = null

              override fun onCreate() { super.onCreate(); instance = this }

              override fun onDestroy() { stopOverlay(); instance = null; super.onDestroy() }

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  startFg()
                  if (!Client.connected) Client.connect(this)
                  val mode = i?.getStringExtra("mode")
                  if (mode == "run" || mode == "edit") {
                      if (!startOverlay()) { shutdown(); return START_NOT_STICKY }
                      setEdit(mode == "edit")
                  }
                  return START_NOT_STICKY
              }

              private fun startFg() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("gmp", "Mapeador", NotificationManager.IMPORTANCE_LOW))
                  val n = Notification.Builder(this, "gmp")
                      .setContentTitle("Gengar Mouse Pro")
                      .setContentText("Mapeador ativo")
                      .setSmallIcon(android.R.drawable.ic_menu_manage)
                      .build()
                  if (Build.VERSION.SDK_INT >= 34) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  else startForeground(1, n)
              }

              fun reloadLayout() { layout = Config.load(this) }

              private fun startOverlay(): Boolean {
                  if (overlay != null) return true
                  if (!Settings.canDrawOverlays(this)) return false
                  reloadLayout()
                  val v = OverlayView(this, this)
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  wm!!.addView(v, params(false))
                  overlay = v
                  return true
              }

              private fun stopOverlay() {
                  releaseAll()
                  overlay?.let {
                      it.setCapture(false)
                      try { wm?.removeView(it) } catch (_: Exception) {}
                  }
                  overlay = null
              }

              fun shutdown() {
                  stopOverlay()
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  stopSelf()
              }

              fun setEdit(on: Boolean) {
                  val v = overlay ?: return
                  releaseAll()
                  v.edit = on
                  v.setCapture(!on)
                  wm?.updateViewLayout(v, params(on))
                  v.invalidate()
              }

              private fun params(touchable: Boolean): WindowManager.LayoutParams {
                  var f = WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                  if (!touchable) f = f or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY, f, PixelFormat.TRANSLUCENT
                  )
                  lp.layoutInDisplayCutoutMode = if (Build.VERSION.SDK_INT >= 30) 3 else 1
                  return lp
              }

              // ---------- toques (enviados ao servidor shell) ----------
              private fun alloc(ch: String): Int {
                  val old = chIds[ch]
                  if (old != null) return old
                  var i = 0
                  while (chIds.containsValue(i)) i++
                  chIds[ch] = i
                  return i
              }

              private fun touchDown(ch: String, x: Float, y: Float) {
                  val id = alloc(ch)
                  Client.send("D $id $x $y")
              }

              private fun touchMove(ch: String, x: Float, y: Float) {
                  val id = chIds[ch] ?: return
                  Client.send("M $id $x $y")
              }

              private fun touchUp(ch: String) {
                  val id = chIds.remove(ch) ?: return
                  Client.send("U $id")
              }

              // ---------- entradas ----------
              fun isMapped(code: Int): Boolean =
                  layout.any { it.key == code || (it.type == Config.JOY && code in it.ks) }

              fun releaseAll() {
                  handler.removeCallbacksAndMessages(null)
                  flushPosted = false
                  pressed.clear()
                  toggled.clear()
                  for (ch in chIds.keys.toList()) touchUp(ch)
                  camOn = false
                  pendX = 0f; pendY = 0f
              }

              fun key(code: Int, down: Boolean) {
                  if (down) { if (!pressed.add(code)) return } else { if (!pressed.remove(code)) return }
                  for (b in layout.toList()) {
                      val x = b.x * sw
                      val y = b.y * sh
                      when (b.type) {
                          Config.TAP -> if (down && b.key == code) tap(b, x, y)
                          Config.HOLD -> if (b.key == code) {
                              if (down) touchDown("h_" + b.id, x, y) else touchUp("h_" + b.id)
                          }
                          Config.TOGGLE -> if (down && b.key == code) {
                              if (toggled.remove(b.id)) touchUp("g_" + b.id)
                              else { toggled.add(b.id); touchDown("g_" + b.id, x, y) }
                          }
                          Config.JOY -> if (code in b.ks) joy(b)
                      }
                  }
              }

              fun pulse(code: Int) {
                  key(code, true)
                  handler.postDelayed({ key(code, false) }, 70)
              }

              private fun tap(b: Config.Btn, x: Float, y: Float) {
                  val ch = "t_" + b.id
                  if (chIds.containsKey(ch)) return
                  touchDown(ch, x, y)
                  handler.postDelayed({ touchUp(ch) }, 45)
              }

              private fun joy(b: Config.Btn) {
                  val dx = (if (b.ks[3] in pressed) 1 else 0) - (if (b.ks[1] in pressed) 1 else 0)
                  val dy = (if (b.ks[2] in pressed) 1 else 0) - (if (b.ks[0] in pressed) 1 else 0)
                  val ch = "j_" + b.id
                  if (dx == 0 && dy == 0) { touchUp(ch); return }
                  val cx = b.x * sw
                  val cy = b.y * sh
                  val rr = b.r * min(sw, sh)
                  val n = hypot(dx.toFloat(), dy.toFloat())
                  if (!chIds.containsKey(ch)) touchDown(ch, cx, cy)
                  touchMove(ch, cx + dx / n * rr, cy + dy / n * rr)
              }

              // ---------- câmera (mouse) ----------
              private val flush = Runnable { flushPosted = false; moveCam() }
              private val camIdle = Runnable { if (camOn) { touchUp("cam"); camOn = false } }

              fun addDelta(dx: Float, dy: Float) {
                  pendX += dx; pendY += dy
                  if (!flushPosted) { flushPosted = true; handler.postDelayed(flush, 8) }
              }

              private fun moveCam() {
                  val c = layout.firstOrNull { it.type == Config.CAM }
                  val dx = pendX
                  val dy = pendY
                  pendX = 0f; pendY = 0f
                  if (c == null || (dx == 0f && dy == 0f)) return
                  val cx = c.x * sw
                  val cy = c.y * sh
                  val ext = c.r * min(sw, sh)
                  val firing = layout.any { it.type == Config.HOLD && it.id == "fire" && it.key in pressed }
                  val fm = if (firing) Config.fireMul(this) else 1f
                  if (!camOn) { camX = cx; camY = cy; touchDown("cam", cx, cy); camOn = true }
                  camX += dx * Config.sensX(this) * fm
                  camY += dy * Config.sensY(this) * fm
                  if (abs(camX - cx) > ext || abs(camY - cy) > ext) {
                      touchUp("cam"); camX = cx; camY = cy; touchDown("cam", cx, cy)
                  } else {
                      touchMove("cam", camX, camY)
                  }
                  handler.removeCallbacks(camIdle)
                  handler.postDelayed(camIdle, 150)
              }
          }
          EOF

